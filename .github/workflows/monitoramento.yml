name: Monitor de Ativos Diário

on:
  schedule:
    # Roda todos os dias às 21:00 UTC (18:00 no horário de Brasília)
    - cron: '0 21 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install yfinance requests

    - name: Executar Script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python monitor.py

    - name: Salvar Memória (Commit e Push)
      run: |
        git config --global user.name "Robô de Monitoramento"
        git config --global user.email "actions@github.com"
        git add log_alertas.json
        git commit -m "Atualizando memória de alertas" || echo "Nenhum alerta novo para salvar na memória."
        git push
